name: capsula_frontend
description: Interface multiplataforma para a central de chamados Capsula.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Pixel
      fonts:
        - asset: assets/fonts/Jersey10.ttf
    - family: Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
